name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Codebase
        run: npm run lint
        
      - name: Type Check Website
        run: cd packages/website && npm run type-check
        
      - name: Type Check Management
        run: cd packages/management && npm run type-check
        
      - name: Type Check Customer Portal
        run: cd packages/customer-portal && npm run type-check

  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Build Backend
        run: cd backend && npm run build
        
      - name: Test Backend
        run: cd backend && npm test
