name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check backend
        run: cd backend && npx tsc --noEmit

      - name: Type check management
        run: cd packages/management && npx vue-tsc --noEmit

      - name: Type check customer-portal
        run: cd packages/customer-portal && npx vue-tsc --noEmit

  # ==================== 后端测试 ====================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci
      METRICS_BEARER_TOKEN: test-metrics-token

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Run tests with coverage
        run: cd backend && npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ==================== 安全审计 ====================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  # ==================== 构建前端 ====================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        app: [website, management, customer-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        run: npm run build:${{ matrix.app == 'customer-portal' && 'portal' || matrix.app }}

  # ==================== 构建并推送 Docker 镜像 ====================
  build-and-push:
    name: Build & Push ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            dockerfile: docker/backend.Dockerfile
          - app: website
            dockerfile: docker/website.Dockerfile
          - app: management
            dockerfile: docker/management.Dockerfile
          - app: portal
            dockerfile: docker/portal.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/thny-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到生产环境 ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Generate SSL certs for deployment
        run: |
          mkdir -p certs/thny.sg certs/crm.thny.sg certs/portal.thny.sg
          for DOMAIN in thny.sg crm.thny.sg portal.thny.sg; do
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout certs/$DOMAIN/privkey.pem \
              -out certs/$DOMAIN/fullchain.pem \
              -subj "/CN=$DOMAIN/O=TongHai Nanyang/C=SG" \
              -addext "subjectAltName=DNS:$DOMAIN" 2>/dev/null
          done

      - name: Sync config and certs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/nginx.conf,docker/docker-compose.prod.yml,certs"
          target: "/var/www/tonghai"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /var/www/tonghai

            # 将仓库的 docker-compose.prod.yml 复制为服务器使用的 docker-compose.yml
            cp -f docker-compose.prod.yml docker-compose.yml

            # 确保 .env 文件存在
            if [ ! -f .env ]; then
              echo "❌ .env 文件不存在！请先在服务器上创建 /var/www/tonghai/.env"
              exit 1
            fi

            # 1. 拉取最新镜像
            docker compose pull

            # 2. 运行数据库迁移
            docker compose run --rm --no-deps backend npx prisma migrate deploy

            # 3. 初始化 RBAC 角色和管理员账号（幂等操作）
            docker compose run --rm --no-deps backend npx tsx prisma/seed-rbac.ts
            docker compose run --rm --no-deps -e ADMIN_EMAIL -e ADMIN_PASSWORD backend npx tsx prisma/seed-admin.ts 2>/dev/null || echo "⚠️ 管理员初始化跳过"

            # 4. 启动所有服务（强制重建）
            docker compose up -d --force-recreate --remove-orphans

            # 5. 等待后端就绪
            echo "⏳ 等待后端启动 (最多 90 秒)..."
            sleep 10
            timeout 80 bash -c 'until docker compose exec -T backend curl -sf http://localhost:4000/api/v1/health > /dev/null 2>&1; do sleep 3; done' || {
              echo "❌ 后端健康检查失败"
              docker compose logs --tail=50 backend
              exit 1
            }
            echo "✅ 后端已就绪"

            # 6. 验证所有容器状态
            echo "📋 容器运行状态："
            docker compose ps

            # 7. 验证域名映射
            echo "📋 Nginx 域名映射："
            grep -E "server_name|upstream.*server" nginx.conf | head -20

            # 8. 清理旧镜像
            docker image prune -f

            echo "✅ 部署完成"
