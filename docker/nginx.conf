worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # 后端 upstream
    upstream backend_server {
        server backend:4000;
    }

    # 1. 官网 (Website) - 端口 80
    server {
        listen 80;
        server_name thny.sg www.thny.sg;
        
        # 允许 IP 直接访问 (默认 Server)
        
        root /var/www/html/website;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 代理 API
        location /api {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. CRM 管理端 (Management) - 端口 8080 (Cloudflare 支持)
    server {
        listen 8080;
        server_name crm.thny.sg;
        
        root /var/www/html/management;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. 客户门户 (Portal) - 端口 8880 (Cloudflare 支持)
    server {
        listen 8880;
        server_name portal.thny.sg;
        
        root /var/www/html/customer-portal;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
