services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:15-alpine
    container_name: tonghai-postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user -d crm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: tonghai-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 后端 API 服务 ==========
  backend:
    image: ghcr.io/jiach72/thny-backend:latest
    container_name: tonghai-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://crm_user:${DB_PASSWORD:-changeme}@postgres:5432/crm_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      MANAGEMENT_URL: ${MANAGEMENT_URL}
      PORTAL_URL: ${PORTAL_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tonghai-network

  # ========== 前端服务 ==========
  website:
    image: ghcr.io/jiach72/thny-website:latest
    container_name: tonghai-website
    restart: always
    networks:
      - tonghai-network

  management:
    image: ghcr.io/jiach72/thny-management:latest
    container_name: tonghai-management
    restart: always
    networks:
      - tonghai-network

  portal:
    image: ghcr.io/jiach72/thny-portal:latest
    container_name: tonghai-portal
    restart: always
    networks:
      - tonghai-network

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: tonghai-nginx
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
      - "8880:8880"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - website
      - management
      - portal
    networks:
      - tonghai-network

volumes:
  postgres_data:
  redis_data:


networks:
  tonghai-network:
    driver: bridge
