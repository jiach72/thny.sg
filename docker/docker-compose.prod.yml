services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:15-alpine
    container_name: tonghai-postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user -d crm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: tonghai-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    environment:
      # 使用环境变量传递密码给 healthcheck，避免在进程列表中暴露
      REDISCLI_AUTH: ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_data:/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ========== 后端 API 服务 ==========
  backend:
    image: ghcr.io/jiach72/thny-backend:latest
    container_name: tonghai-backend
    restart: always
    # 后端仅通过 Nginx 反向代理访问，不直接暴露端口到宿主机
    # ports:
    #   - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://crm_user:${DB_PASSWORD:-changeme}@postgres:5432/crm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: ${FRONTEND_URL}
      MANAGEMENT_URL: ${MANAGEMENT_URL}
      PORTAL_URL: ${PORTAL_URL}
      # Sentry DSN（可选）
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 2FA 加密密钥（可选，缺失时降级为开发模式）
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:-}
      # Metrics 认证令牌（可选，缺失时 /metrics 返回 503）
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      # 管理员初始化（部署时 seed 使用）
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ========== 前端服务 ==========
  website:
    image: ghcr.io/jiach72/thny-website:latest
    container_name: tonghai-website
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  management:
    image: ghcr.io/jiach72/thny-management:latest
    container_name: tonghai-management
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  portal:
    image: ghcr.io/jiach72/thny-portal:latest
    container_name: tonghai-portal
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: tonghai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - website
      - management
      - portal
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ========== Certbot (HTTPS 证书自动签发与续期) ==========
  certbot:
    image: certbot/certbot
    container_name: tonghai-certbot
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ========== PostgreSQL 自动备份 ==========
  pgbackups:
    image: prodrigestivill/postgres-backup-local:15
    container_name: tonghai-db-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      # S3 异地备份配置（启用后备份文件自动上传至 S3）
      S3_BACKUP: "${S3_BACKUP:-false}"
      S3_BUCKET: "${S3_BACKUP_BUCKET:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-southeast-1}"
    volumes:
      - db_backups:/backups
      - ./scripts/backup-upload.sh:/scripts/backup-upload.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  certbot_webroot:
  certbot_certs:
  db_backups:


networks:
  tonghai-network:
    driver: bridge
