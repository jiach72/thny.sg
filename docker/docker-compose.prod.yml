services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:15-alpine
    container_name: tonghai-postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user -d crm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: tonghai-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_data:/data
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ========== 后端 API 服务 ==========
  backend:
    image: ghcr.io/jiach72/thny-backend:latest
    container_name: tonghai-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://crm_user:${DB_PASSWORD:-changeme}@postgres:5432/crm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: ${FRONTEND_URL}
      MANAGEMENT_URL: ${MANAGEMENT_URL}
      PORTAL_URL: ${PORTAL_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TWO_FA_ENCRYPTION_KEY: ${TWO_FA_ENCRYPTION_KEY:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ========== 前端服务 ==========
  website:
    image: ghcr.io/jiach72/thny-website:latest
    container_name: tonghai-website
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  management:
    image: ghcr.io/jiach72/thny-management:latest
    container_name: tonghai-management
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  portal:
    image: ghcr.io/jiach72/thny-portal:latest
    container_name: tonghai-portal
    restart: always
    networks:
      - tonghai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: tonghai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - website
      - management
      - portal
    networks:
      - tonghai-network
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:80" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ========== PostgreSQL 自动备份 ==========
  pgbackups:
    image: prodrigestivill/postgres-backup-local:15
    container_name: tonghai-db-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      S3_BACKUP: "${S3_BACKUP:-false}"
      S3_BUCKET: "${S3_BACKUP_BUCKET:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-southeast-1}"
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tonghai-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - |
        sed "s|__METRICS_BEARER_TOKEN__|$${METRICS_BEARER_TOKEN}|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.retention.time=30d
    networks:
      - tonghai-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tonghai-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    networks:
      - tonghai-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tonghai-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://crm_user:${DB_PASSWORD:-changeme}@postgres:5432/crm_db?sslmode=disable"
    networks:
      - tonghai-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: tonghai-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
    networks:
      - tonghai-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: tonghai-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - tonghai-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  db_backups:
  prometheus-data:
  grafana-data:

networks:
  tonghai-network:
    driver: bridge
