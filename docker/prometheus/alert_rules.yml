groups:
  - name: crm-api
    rules:
      - alert: HighErrorRate
        expr: rate(crm_http_requests_total{status_code=~"5.."}[5m]) / rate(crm_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.method }} {{ $labels.route }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(crm_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (P95 > 2s)"
          description: "P95 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.route }}"

      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend API is down"
          description: "Backend has been unreachable for 1 minute"

      - alert: DatabaseConnectionFailed
        expr: crm_nodejs_active_handles_total > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of active handles"
          description: "{{ $value }} active handles detected"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / (1024 * 1024) > 512
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Process using {{ $value | humanize }}B of memory"

  - name: infrastructure
    rules:
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

      - alert: PostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
