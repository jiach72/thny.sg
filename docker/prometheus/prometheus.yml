global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tonghai-crm
    environment: production

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - alertmanager:9093

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics"
    bearer_token: "__METRICS_BEARER_TOKEN__"
    static_configs:
      - targets: ["backend:4000"]
        labels:
          service: "crm-api"
    scrape_interval: 10s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-metrics"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgresql"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
