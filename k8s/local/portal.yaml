apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: tonghai-dev
  labels:
    app: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: thny-portal:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: tonghai-dev
spec:
  type: NodePort
  selector:
    app: portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082
